<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Night Safari Translator V3.1</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #121212; color: #f1f1f1; margin: 0; padding: 16px; display: flex; flex-direction: column; align-items: center; }
    .container { width: 100%; max-width: 480px; padding-bottom: 40px; }
    h2 { text-align: center; color: #4ade80; margin: 0 0 12px 0; font-size: 1.3rem; }

    /* แถบสลับหน้า */
    .nav-tabs { display: flex; gap: 8px; margin-bottom: 16px; background: #1e1e1e; padding: 6px; border-radius: 12px; border: 1px solid #333; }
    .nav-btn { flex: 1; padding: 10px; border: none; border-radius: 8px; background: transparent; color: #aaa; font-weight: bold; font-size: 0.95rem; cursor: pointer; transition: 0.2s; }
    .nav-btn.active { background: #4ade80; color: #000; }

    /* กล่องใส่ API Key */
    .api-box { background: #1e1e1e; padding: 10px 12px; border-radius: 10px; margin-bottom: 14px; border: 1px solid #333; }
    .api-box summary { cursor: pointer; color: #aaa; font-size: 0.85rem; }
    .api-box input { width: 100%; padding: 8px; margin-top: 8px; border-radius: 6px; border: 1px solid #444; background: #2a2a2a; color: #fff; }

    /* ฟอร์มแปลภาษา */
    textarea { width: 100%; height: 80px; padding: 12px; border-radius: 10px; border: 1px solid #444; background: #1e1e1e; color: #fff; font-size: 1rem; resize: none; margin-bottom: 10px; }
    textarea:focus { outline: none; border-color: #4ade80; }
    .btn-main { width: 100%; padding: 14px; border: none; border-radius: 10px; background: #4ade80; color: #000; font-size: 1.05rem; font-weight: bold; cursor: pointer; }
    .btn-main:disabled { background: #555; color: #888; }

    /* กล่องผลลัพธ์แปลสด */
    .result-box { margin-top: 18px; display: none; flex-direction: column; gap: 12px; }
    .card { background: #1e1e1e; padding: 14px; border-radius: 12px; border-left: 4px solid #4ade80; }
    .card.en { border-left-color: #38bdf8; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .label { font-size: 0.8rem; color: #888; font-weight: bold; }
    .action-btns { display: flex; gap: 6px; }
    .btn-small { background: #2a2a2a; color: #ddd; border: 1px solid #444; padding: 5px 9px; border-radius: 6px; font-size: 0.8rem; cursor: pointer; }
    .btn-small:active { background: #444; }
    .zh-text { font-size: 1.4rem; font-weight: bold; color: #fff; margin-bottom: 4px; }
    .pinyin-text { font-size: 1rem; color: #4ade80; }
    .en-text { font-size: 1.15rem; font-weight: bold; color: #fff; }

    /* แถบเซฟลงสมุด */
    .save-bar { display: flex; gap: 8px; background: #1e1e1e; padding: 10px; border-radius: 10px; border: 1px dashed #4ade80; align-items: center; }
    .save-bar select { flex: 1; padding: 8px; border-radius: 6px; background: #2a2a2a; color: #fff; border: 1px solid #444; font-size: 0.9rem; }
    .btn-save { background: #4ade80; color: #000; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; }

    /* หน้าสมุดประโยค */
    .search-input { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #444; background: #1e1e1e; color: #fff; font-size: 0.95rem; margin-bottom: 10px; }
    .cat-tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px; }
    .cat-btn { padding: 6px 12px; border-radius: 20px; border: 1px solid #444; background: #1e1e1e; color: #ccc; font-size: 0.85rem; white-space: nowrap; cursor: pointer; }
    .cat-btn.active { background: #38bdf8; color: #000; border-color: #38bdf8; font-weight: bold; }

    .phrase-list { display: flex; flex-direction: column; gap: 10px; }
    .phrase-card { background: #1e1e1e; padding: 14px; border-radius: 10px; border: 1px solid #2e2e2e; position: relative; }
    .phrase-card.pinned { border-color: #facc15; background: #222015; }
    .p-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; }
    .p-th { font-size: 0.95rem; color: #e2e8f0; font-weight: bold; }
    .p-zh { font-size: 1.25rem; color: #4ade80; font-weight: bold; margin-bottom: 2px; }
    .p-pinyin { font-size: 0.9rem; color: #86efac; margin-bottom: 6px; }
    .p-en { font-size: 1rem; color: #38bdf8; margin-bottom: 10px; }
    .p-actions { display: flex; flex-wrap: wrap; gap: 6px; border-top: 1px solid #333; padding-top: 8px; }

    /* โหมดยื่นจอ */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 999; flex-direction: column; justify-content: center; align-items: center; padding: 24px; text-align: center; }
    .modal-zh { font-size: 2.6rem; font-weight: bold; color: #4ade80; margin-bottom: 12px; line-height: 1.3; }
    .modal-pinyin { font-size: 1.3rem; color: #aaa; margin-bottom: 28px; }
    .modal-en { font-size: 1.8rem; font-weight: bold; color: #fff; line-height: 1.3; }
    .modal-close { position: absolute; top: 20px; right: 20px; background: #333; color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; }

    /* กล่อง Backup */
    .backup-box { margin-top: 24px; padding-top: 16px; border-top: 1px solid #333; display: flex; gap: 8px; }
    .btn-backup { flex: 1; padding: 10px; background: #2a2a2a; color: #ccc; border: 1px solid #444; border-radius: 8px; font-size: 0.85rem; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <h2>🐾 Night Safari Translator</h2>

  <div class="nav-tabs">
    <button class="nav-btn active" id="tabTranslate" onclick="switchTab('translate')">💬 แปลสด</button>
    <button class="nav-btn" id="tabBook" onclick="switchTab('book')">📖 สมุดประโยค</button>
  </div>

  <!-- ================= หน้าที่ 1: แปลสด ================= -->
  <div id="viewTranslate">
    <details class="api-box" id="apiDetails">
      <summary>⚙️ ตั้งค่า DeepSeek API Key</summary>
      <input type="password" id="apiKeyInput" placeholder="วาง sk-... ของมึงตรงนี้" onchange="saveKey()">
    </details>

    <textarea id="thaiInput" placeholder="พิมพ์ภาษาไทยสั้น ๆ เช่น: กรุณาโชว์คิวอาร์โค้ดก่อนขึ้นรถราง..."></textarea>
    <button class="btn-main" id="translateBtn" onclick="translateText()">แปลภาษาเลย</button>

    <div class="result-box" id="resultBox">
      <div class="save-bar">
        <select id="saveCategory">
          <option value="ticket">🎫 ตรวจบัตร/คิว</option>
          <option value="show">🐯 รอบโชว์/โซนสัตว์</option>
          <option value="alert">🌧️ แจ้งเตือน/ฉุกเฉิน</option>
        </select>
        <button class="btn-save" onclick="saveCurrentToBook()">➕ เซฟลงสมุด</button>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="label">🇨🇳 ภาษาจีน</span>
          <div class="action-btns">
            <button class="btn-small" onclick="openModal(currentResult.zh, currentResult.pinyin, currentResult.en)">📱 เต็มจอ</button>
            <button class="btn-small" onclick="speak(currentResult.zh, 'zh-CN')">🔊 ฟัง</button>
            <button class="btn-small" onclick="copy(currentResult.zh, this)">📋 ก๊อป</button>
          </div>
        </div>
        <div class="zh-text" id="zhOut">-</div>
        <div class="pinyin-text" id="pinyinOut">-</div>
      </div>

      <div class="card en">
        <div class="card-header">
          <span class="label">🇬🇧 ภาษาอังกฤษ</span>
          <div class="action-btns">
            <button class="btn-small" onclick="speak(currentResult.en, 'en-US')">🔊 ฟัง</button>
            <button class="btn-small" onclick="copy(currentResult.en, this)">📋 ก๊อป</button>
          </div>
        </div>
        <div class="en-text" id="enOut">-</div>
      </div>
    </div>
  </div>

  <!-- ================= หน้าที่ 2: สมุดประโยค ================= -->
  <div id="viewBook" style="display: none;">
    <input type="text" class="search-input" id="searchInput" placeholder="🔍 ค้นหาประโยค (เช่น บัตร, ฝนตก, ห้องน้ำ)..." oninput="renderBook()">
    
    <div class="cat-tabs">
      <button class="cat-btn active" onclick="filterCat('all', this)">ทั้งหมด</button>
      <button class="cat-btn" onclick="filterCat('ticket', this)">🎫 ตรวจบัตร/คิว</button>
      <button class="cat-btn" onclick="filterCat('show', this)">🐯 รอบโชว์/โซน</button>
      <button class="cat-btn" onclick="filterCat('alert', this)">🌧️ ฉุกเฉิน/ทั่วไป</button>
    </div>

    <div class="phrase-list" id="phraseList"></div>

    <!-- ปุ่ม Backup / Restore แบบใหม่ -->
    <div class="backup-box">
      <button class="btn-backup" onclick="exportData()">📤 สำรองข้อมูล</button>
      <button class="btn-backup" onclick="toggleRestoreBox()">📥 กู้คืนข้อมูล</button>
    </div>

    <!-- กล่องสำหรับวางโค้ดกู้คืน -->
    <div id="restoreBox" style="display: none; margin-top: 12px; background: #1e1e1e; padding: 12px; border-radius: 10px; border: 1px solid #38bdf8;">
      <textarea id="restoreInput" placeholder="วางโค้ด JSON ยาว ๆ ที่ก๊อปมาลงในช่องนี้..." style="height: 90px; margin-bottom: 8px; font-size: 0.85rem;"></textarea>
      <button class="btn-main" style="padding: 10px; font-size: 0.95rem; background: #38bdf8;" onclick="confirmRestore()">✅ ยืนยันการกู้คืน</button>
    </div>
  </div>
</div>

<!-- โหมดยื่นจอให้ลูกค้าอ่าน -->
<div class="modal" id="flashModal">
  <button class="modal-close" onclick="closeModal()">✖ ปิด</button>
  <div class="modal-zh" id="mZh"></div>
  <div class="modal-pinyin" id="mPinyin"></div>
  <div class="modal-en" id="mEn"></div>
</div>

<script>
  let currentResult = null;
  let currentCat = 'all';

  const defaultPhrases = [
    { id: 1, cat: 'ticket', pinned: true, th: 'กรุณาแสดงคิวอาร์โค้ดก่อนขึ้นรถรางครับ/ค่ะ', zh: '请在上车前出示您的二维码。', pinyin: 'Qǐng zài shàngchē qián chūshì nín de èrwéimǎ.', en: 'Please show your QR code before boarding the tram.' },
    { id: 2, cat: 'ticket', pinned: false, th: 'รบกวนต่อแถวรอตรงนี้นะครับ/ค่ะ', zh: '请在这里排队等候。', pinyin: 'Qǐng zài zhèlǐ páiduì děnghòu.', en: 'Please queue up here.' },
    { id: 3, cat: 'show', pinned: false, th: 'การแสดงรอบนี้จบลงแล้วครับ/ค่ะ', zh: '本场表演已经结束了。', pinyin: 'Běn chǎng biǎoyǎn yǐjīng jiéshù le.', en: 'This show has already ended.' },
    { id: 4, cat: 'alert', pinned: false, th: 'ขออภัยครับ/ค่ะ ฝนตกหนัก รถรางหยุดให้บริการชั่วคราว', zh: '抱歉，因下大雨，游览车暂停服务。', pinyin: 'Bàoqiàn, yīn xià dàyǔ, yóulǎnchē zàntíng fúwù.', en: 'Sorry, tram service is temporarily suspended due to heavy rain.' }
  ];

  window.onload = () => {
    const savedKey = localStorage.getItem('deepseek_key');
    if (savedKey) document.getElementById('apiKeyInput').value = savedKey;
    else document.getElementById('apiDetails').open = true;

    if (!localStorage.getItem('safari_book')) {
      localStorage.setItem('safari_book', JSON.stringify(defaultPhrases));
    }
  };

  function saveKey() {
    localStorage.setItem('deepseek_key', document.getElementById('apiKeyInput').value.trim());
  }

  function switchTab(tab) {
    document.getElementById('tabTranslate').classList.toggle('active', tab === 'translate');
    document.getElementById('tabBook').classList.toggle('active', tab === 'book');
    document.getElementById('viewTranslate').style.display = tab === 'translate' ? 'block' : 'none';
    document.getElementById('viewBook').style.display = tab === 'book' ? 'block' : 'none';
    if (tab === 'book') renderBook();
  }

  async function translateText() {
    const apiKey = document.getElementById('apiKeyInput').value.trim();
    const text = document.getElementById('thaiInput').value.trim();
    const btn = document.getElementById('translateBtn');

    if (!apiKey) {
      alert('มึงลืมใส่ API Key! กดตรงตั้งค่าข้างบนก่อน');
      document.getElementById('apiDetails').open = true;
      return;
    }
    if (!text) return;

    btn.disabled = true;
    btn.innerText = 'กำลังแปล...';

    const systemPrompt = `คุณคือล่ามหน้างานของ "เชียงใหม่ไนท์ซาฟารี" (Chiang Mai Night Safari) 
หน้าที่: แปลข้อความภาษาไทยของพนักงานให้เป็นภาษาจีนตัวย่อ (พร้อมพินอิน) และภาษาอังกฤษ
กฎเหล็ก:
1. ต้อง "สั้น กระชับ แต่สุภาพและเป็นมืออาชีพ" เหมาะกับการสื่อสารหน้างานที่คนเยอะและเร่งรีบ
2. ใช้คำศัพท์ให้ตรงบริบทสวนสัตว์ เช่น รถราง (tram/游览车), รอบการแสดง (show/表演), โซนสัตว์ (zone/园区), สแกนบัตร (scan ticket/检票)
3. ตอบกลับเป็น JSON เท่านั้น ห้ามมีข้อความอื่นปนเด็ดขาด ตามรูปแบบนี้:
{"zh": "ภาษาจีน", "pinyin": "คำอ่านพินอิน", "en": "ภาษาอังกฤษ"}`;

    try {
      const response = await fetch('https://api.deepseek.com/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
        body: JSON.stringify({
          model: 'deepseek-chat',
          messages: [{ role: 'system', content: systemPrompt }, { role: 'user', content: text }],
          response_format: { type: 'json_object' },
          temperature: 0.3
        })
      });

      const data = await response.json();
      if (!response.ok) throw new Error(data.error?.message || 'ยิง API ไม่ผ่าน');

      const res = JSON.parse(data.choices[0].message.content);
      currentResult = { th: text, zh: res.zh, pinyin: res.pinyin, en: res.en };

      document.getElementById('zhOut').innerText = res.zh;
      document.getElementById('pinyinOut').innerText = res.pinyin;
      document.getElementById('enOut').innerText = res.en;
      document.getElementById('resultBox').style.display = 'flex';

    } catch (err) {
      alert('Error: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.innerText = 'แปลภาษาเลย';
    }
  }

  function saveCurrentToBook() {
    if (!currentResult) return;
    const cat = document.getElementById('saveCategory').value;
    let book = JSON.parse(localStorage.getItem('safari_book') || '[]');
    
    book.unshift({
      id: Date.now(),
      cat: cat,
      pinned: false,
      th: currentResult.th,
      zh: currentResult.zh,
      pinyin: currentResult.pinyin,
      en: currentResult.en
    });

    localStorage.setItem('safari_book', JSON.stringify(book));
    alert('✅ เซฟลงสมุดประโยคเรียบร้อย!');
  }

  function filterCat(cat, btn) {
    currentCat = cat;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderBook();
  }

  function renderBook() {
    let book = JSON.parse(localStorage.getItem('safari_book') || '[]');
    const keyword = document.getElementById('searchInput').value.toLowerCase().trim();
    const list = document.getElementById('phraseList');

    let filtered = book.filter(item => {
      const matchCat = currentCat === 'all' || item.cat === currentCat;
      const matchKey = item.th.toLowerCase().includes(keyword) || item.zh.includes(keyword) || item.en.toLowerCase().includes(keyword);
      return matchCat && matchKey;
    });

    filtered.sort((a, b) => (b.pinned === true) - (a.pinned === true));

    list.innerHTML = '';
    if (filtered.length === 0) {
      list.innerHTML = '<div style="text-align:center; color:#666; padding:20px;">ไม่เจอประโยคที่หาเลยว่ะ</div>';
      return;
    }

    filtered.forEach(item => {
      const div = document.createElement('div');
      div.className = `phrase-card ${item.pinned ? 'pinned' : ''}`;
      div.innerHTML = `
        <div class="p-top">
          <div class="p-th">${item.pinned ? '⭐ ' : ''}${item.th}</div>
          <button class="btn-small" onclick="togglePin(${item.id})">${item.pinned ? 'เอาดาวออก' : '⭐ ปักหมุด'}</button>
        </div>
        <div class="p-zh">${item.zh}</div>
        <div class="p-pinyin">${item.pinyin}</div>
        <div class="p-en">${item.en}</div>
        <div class="p-actions">
          <button class="btn-small" onclick="openModal('${escapeStr(item.zh)}', '${escapeStr(item.pinyin)}', '${escapeStr(item.en)}')">📱 เต็มจอ</button>
          <button class="btn-small" onclick="speak('${escapeStr(item.zh)}', 'zh-CN')">🔊 จีน</button>
          <button class="btn-small" onclick="speak('${escapeStr(item.en)}', 'en-US')">🔊 อังกฤษ</button>
          <button class="btn-small" onclick="copy('${escapeStr(item.zh)}', this)">📋 ก๊อปจีน</button>
          <button class="btn-small" style="color:#f87171; margin-left:auto;" onclick="deletePhrase(${item.id})">🗑️</button>
        </div>
      `;
      list.appendChild(div);
    });
  }

  function togglePin(id) {
    let book = JSON.parse(localStorage.getItem('safari_book') || '[]');
    book = book.map(item => item.id === id ? { ...item, pinned: !item.pinned } : item);
    localStorage.setItem('safari_book', JSON.stringify(book));
    renderBook();
  }

  function deletePhrase(id) {
    if (!confirm('ลบประโยคนี้ทิ้งนะ?')) return;
    let book = JSON.parse(localStorage.getItem('safari_book') || '[]');
    book = book.filter(item => item.id !== id);
    localStorage.setItem('safari_book', JSON.stringify(book));
    renderBook();
  }

  function openModal(zh, pinyin, en) {
    document.getElementById('mZh').innerText = zh;
    document.getElementById('mPinyin').innerText = pinyin;
    document.getElementById('mEn').innerText = en;
    document.getElementById('flashModal').style.display = 'flex';
  }
  function closeModal() {
    document.getElementById('flashModal').style.display = 'none';
  }

  function speak(text, lang) {
    if (!('speechSynthesis' in window)) return alert('Browser ไม่รองรับเสียงพูด');
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang;
    u.rate = 0.9;
    window.speechSynthesis.speak(u);
  }

  function copy(text, btn) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(() => showCopied(btn)).catch(() => fallbackCopy(text, btn));
    } else {
      fallbackCopy(text, btn);
    }
  }

  function fallbackCopy(text, btn) {
    const textArea = document.createElement("textarea");
    textArea.value = text;
    textArea.style.position = "fixed";
    textArea.style.left = "-9999px";
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    try {
      document.execCommand('copy');
      showCopied(btn);
    } catch (err) {
      alert('ก๊อปไม่ติดว่ะ');
    }
    document.body.removeChild(textArea);
  }

  function showCopied(btn) {
    const old = btn.innerText;
    btn.innerText = '✅ แล้ว';
    setTimeout(() => btn.innerText = old, 1200);
  }

  function escapeStr(str) {
    return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
  }

  function exportData() {
    const data = localStorage.getItem('safari_book');
    const textArea = document.createElement("textarea");
    textArea.value = data;
    textArea.style.position = "fixed";
    textArea.style.left = "-9999px";
    document.body.appendChild(textArea);
    textArea.focus();
    textArea.select();
    try {
      document.execCommand('copy');
      alert('📋 ก๊อปปี้ข้อมูลสำรองเรียบร้อย! เอาไปวางเก็บในแอป Note ได้เลย');
    } catch (err) {
      prompt('ก๊อปจากกล่องนี้แทน:', data);
    }
    document.body.removeChild(textArea);
  }

  function toggleRestoreBox() {
    const box = document.getElementById('restoreBox');
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
  }

  function confirmRestore() {
    const raw = document.getElementById('restoreInput').value.trim();
    if (!raw) {
      alert('มึงยังไม่ได้วางโค้ดเลยไอ้เวร!');
      return;
    }
    try {
      const parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) throw new Error('ไม่ใช่รูปแบบรายการสมุด');
      
      localStorage.setItem('safari_book', JSON.stringify(parsed));
      renderBook();
      
      document.getElementById('restoreInput').value = '';
      document.getElementById('restoreBox').style.display = 'none';
      alert(`✅ กู้คืนสำเร็จ! ได้กลับมาทั้งหมด ${parsed.length} ประโยค`);
    } catch (e) {
      alert('❌ พังตรงนี้: ' + e.message);
    }
  }
</script>

</body>
</html>
